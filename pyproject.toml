[project]
name = "tiny-api-agent"
version = "0.0.1"
description = "GRPO-trained small executor that calls unseen APIs from a possibly stale spec"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "anthropic>=1.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiny_api_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
