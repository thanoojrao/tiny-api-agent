[project]
name = "tiny-api-agent"
version = "0.0.1"
description = "GRPO-trained small executor that calls unseen APIs from a possibly stale spec"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "anthropic>=1.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# GPU box only. Pinned together on 2026-11-03: TRL accepts vLLM 0.22.1..0.32.x, and vLLM 0.32.0
# pins torch 2.13.0, so these three move as a set. transformers is left to resolve inside
# vLLM's window. Linux-only because vLLM ships no Windows wheels; `uv sync --extra train` on the pod.
train = [
    "torch==2.13.0; sys_platform == 'linux'",
    "vllm==0.32.0; sys_platform == 'linux'",
    "trl==1.17.1; sys_platform == 'linux'",
    "peft==0.21.2; sys_platform == 'linux'",
    "huggingface-hub>=2.4.0; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiny_api_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
